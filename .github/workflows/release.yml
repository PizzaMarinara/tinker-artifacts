name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Guard against publishing a private package
        run: |
          if [ "$(jq -r .private package.json)" = "true" ]; then
            echo 'package.json still has "private": true — remove it in the release commit.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs a recent npm
      - run: npm publish --provenance
