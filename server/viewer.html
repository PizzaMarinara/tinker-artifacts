<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>tinker artifact</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #fff; display: flex; flex-direction: column; }
  #bar { display: none; align-items: center; gap: 12px; padding: 0 14px; height: 42px; border-bottom: 1px solid rgba(127,127,127,.25); font-size: 13px; color: #333; }
  #name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #exp { color: #888; white-space: nowrap; }
  #dl { font: inherit; padding: 4px 12px; border: 1px solid rgba(127,127,127,.4); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
  #dl:hover { background: rgba(127,127,127,.12); }
  #frame { border: 0; width: 100%; flex: 1; display: none; }
  #status { display: flex; flex: 1; align-items: center; justify-content: center; color: #555; padding: 1rem; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #111; } #status { color: #999; } #bar { color: #ddd; } }
</style>
</head>
<body>
<header id="bar">
  <span id="name"></span>
  <span id="exp"></span>
  <button id="dl" type="button">Download</button>
</header>
<div id="status">Decrypting…</div>
<iframe id="frame" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" title="artifact"></iframe>
<!-- inject:viewer-md.js -->
<script>
(async function () {
  var statusEl = document.getElementById("status");
  var frame = document.getElementById("frame");
  function fail(msg) { statusEl.textContent = msg; }

  function b64uDecode(s) {
    var b = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
    var out = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) out[i] = b.charCodeAt(i);
    return out;
  }

  function timeLeft(expEpoch) {
    var s = expEpoch - Math.floor(Date.now() / 1000);
    if (s <= 0) return "expired";
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min";
    if (s < 172800) return Math.round(s / 3600) + " hours";
    return Math.round(s / 86400) + " days";
  }

  var id = location.pathname.split("/").pop();
  var keyB64u = location.hash.slice(1);
  if (!keyB64u) return fail("Missing decryption key — open the full link, including everything after #.");

  var res;
  try { res = await fetch("/api/artifacts/" + id); } catch (e) { return fail("Network error while fetching the artifact."); }
  if (res.status === 404) return fail("This artifact has expired or does not exist.");
  if (!res.ok) return fail("Failed to fetch the artifact (HTTP " + res.status + ").");

  var envelope;
  try {
    var blob = new Uint8Array(await res.arrayBuffer());
    var key = await crypto.subtle.importKey("raw", b64uDecode(keyB64u), "AES-GCM", false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.slice(0, 12) }, key, blob.slice(12));
    envelope = JSON.parse(new TextDecoder().decode(pt));
  } catch (e) {
    return fail("Decryption failed — the link may be incomplete or corrupted.");
  }

  document.title = envelope.name;
  document.getElementById("name").textContent = envelope.name;
  var expEpoch = Number(res.headers.get("X-Expires-At") || 0);
  if (expEpoch) document.getElementById("exp").textContent = "expires in " + timeLeft(expEpoch);
  document.getElementById("dl").addEventListener("click", function () {
    var mime = envelope.type === "html" ? "text/html" : "text/markdown";
    var url = URL.createObjectURL(new Blob([envelope.content], { type: mime }));
    var a = document.createElement("a");
    a.href = url;
    a.download = envelope.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  });

  frame.srcdoc = envelope.type === "html" ? envelope.content : mdPage(envelope.name, renderMd(envelope.content));
  document.getElementById("bar").style.display = "flex";
  statusEl.style.display = "none";
  frame.style.display = "block";
})();
</script>
</body>
</html>
